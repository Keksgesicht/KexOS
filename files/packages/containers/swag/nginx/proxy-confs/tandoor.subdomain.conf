include /config/nginx/custom/quic-proxy.conf;

server {
    server_name tandoor.tb.*;
    access_log /config/log/nginx/access-tandoor.log combined3;

    include /config/nginx/custom/8443.conf;
    include /config/nginx/custom/quic-external.conf;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass http://172.23.219.1:80/;
    }
}
